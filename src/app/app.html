<main class="flex min-h-dvh items-center justify-center bg-gray-50">
  @if (user()) {
    <div class="flex flex-col items-center gap-4">
      @if (user()!.foto) {
        <img [src]="user()!.foto" alt="Foto de perfil" class="h-20 w-20 rounded-full" />
      }
      <p class="text-lg font-medium text-gray-900">Hola, {{ user()!.nombre }}</p>
      <p class="text-sm text-gray-500">{{ user()!.email }}</p>
    </div>
  } @else {
    <button
      type="button"
      (click)="loginGoogle()"
      class="flex items-center gap-3 rounded-lg border border-gray-300 bg-blue-500 px-5 py-2.5 text-sm font-medium text-white shadow-sm transition hover:bg-blue-400 hover:cursor-pointer"
    >
      <svg class="h-5 w-5" viewBox="0 0 48 48" aria-hidden="true">
        <path
          fill="#FFC107"
          d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.2 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"
        />
        <path
          fill="#FF3D00"
          d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.2 6.1 29.4 4 24 4c-6.4 0-12.1 3.1-15.5 7.8z"
        />
        <path
          fill="#4CAF50"
          d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.9 40.9 16.5 44 24 44z"
        />
        <path
          fill="#1976D2"
          d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.7l6.2 5.2C36.9 40.2 44 36 44 24c0-1.3-.1-2.6-.4-3.9z"
        />
      </svg>
      Iniciar sesión con Google
    </button>
  }
</main>

<router-outlet />
